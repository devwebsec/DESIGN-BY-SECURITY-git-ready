name: Security Design Integration

on:
  push:
    branches: [main, 'integrate/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integration-test:
    name: Design-by-Security ↔ Security Copilot v4
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate skill archive and integration contract
        run: bash tests/security-design-pipeline/run-pipeline.sh

      - name: Validate builder
        run: bash -n build-security-copilot.sh

      - name: Run offline LLM security evaluation
        run: bash evals/llm-security/run-eval.sh

      - name: Generate adversarial mutation corpus
        run: bash evals/llm-security/run-adversarial.sh

      - name: Validate hardened judge adapter syntax
        run: python3 -m py_compile evals/llm-security/judge_adapter.py evals/llm-security/adversarial_mutator.py evals/llm-security/aggregate-eval.py

      - name: Run offline judge hardening check
        run: bash evals/llm-security/run-judge-offline.sh
